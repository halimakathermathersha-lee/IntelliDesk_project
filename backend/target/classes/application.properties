spring.application.name=intellidesk
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/intellidesk1?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.error.include-message=always
intellidesk.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
intellidesk.jwt.expiration-ms=86400000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
